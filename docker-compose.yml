

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: EASYUX
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: NTRAJAkA4hfMQEb
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    # entrypoint: ["/app/entrypoint.sh"]
    command: [ "gunicorn", "easyux.wsgi:application", "--bind", "0.0.0.0:8000"]
    volumes:
      - .:/app
      - static_volume:/app/static
    expose:
      - "8000"
    depends_on:
      - db
    environment:
      - DB_NAME=easyuxdb
      - DB_USER=easyuxuser
      - DB_PASSWORD=secret
      - DB_HOST=db
      - DB_PORT=5432
      - GOOGLE_LOGIN=True
      

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/static
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  pgdata:
  static_volume: